server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

spring:
  logging:
    level:
      root: INFO
      com.example.customerrewards: INFO

logging:
  level:
    root: INFO
    com.example.customerrewards: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# AWS / DynamoDB Configuration
# Defaults to us-east-1 but can be overridden via environment variable AWS_REGION
# For local development, set aws.dynamodb.endpoint to http://localhost:8000
aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    customer-table: customers
    transaction-table: reward_transactions
    idempotency-lock-table: reward_idempotency_locks
